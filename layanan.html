<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILA - Sistem Informasi Layanan Akademik</title>
    <link rel="stylesheet" href="style 1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Awal Header -->
     <header>
        <h1>🎓 SILA</h1>
        <p class="subtitle">Sistem Informasi Layanan Akademik</p>
        <nav>
            <ul class="nav-menu">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="layanan.html"class='active'>Ajukan Layanan</a></li>
                <li><a href="riwayat.html">Riwayat</a></li>
            </ul>
        </nav>
     </header>
     <hr>
     <!-- Akhir Header -->

     <!-- Awal Main -->
      <main>
        <!-- form pengajuan layanan -->
                 <form  action="#" method="post" class="form-card">
                    <fieldset>
                        <legend> Data Pengajuan</legend>
                    </fieldset>
                 </form>
            </div>
        </section>
<!-- form controls di dalam sini -->
<!-- Nama -->
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan Nama Lengkap" required>
          </div>
<!-- NIM -->
  <div class="form-group"> 
            <label for="prodi">Program Studi</label> 
            <select id="prodi" name="prodi" required> 
                <option value="">— Pilih Program Studi —</option>
                <option value="Sistem Informasi">Sistem Informasi<option> 
                <option value="Teknik Informatika">Teknik Informatika</option> 
                <option value="Manajemen">Manajemen</option> 
                <option value="Akuntansi">Akuntansi</option> 
            </select> 
        </div>
    </div>
     <div class="form-row"> 
        <div class="form-group"> 
            <label for="layanan">Jenis Layanan</label> 
            <select id="layanan" name="layanan" required> 
                <option value="">— Pilih Layanan —</option> 
                <option value="SKA">SKA — Surat Aktif Kuliah</option> 
                <option value="CAK">CAK — Cuti Akademik</option> 
                <option value="TNM">TNM — Transkrip Nilai</option> 
                <option value="PDA">PDA — Perubahan Data</option> 
            </select> 
        </div>
        <div class="form-card">
            <label for="tanggal">Tanggal Pengajuan</label>
            <input type="date" id="tanggal" name="tanggal" required>
        </div>
    </div>
    <div class="form-group"> 
        <label for="keterangan">Keterangan (opsional)</label> 
        <textarea id="keterangan" name="keterangan" rows="3" 
            placeholder="Jelaskan alasan pengajuan Anda..."></textarea> 
    </div>
     <div class="form-actions"> 
         <button type="submit" class="btn btn-primary">🚀 Ajukan Sekarang</button> 
         <button type="reset" class="btn btn-outline">↺ Reset</button> 
     </div> 
                
                


        

      </main>
      <!-- akhir Main -->

      <!-- awal footer -->
      <footer>
        <p><b>SILA</b> - Sistem Informasi Layanan Akademik</p>
        <p><b>Platform Digital untuk pengajuan layanan akademik mahasiswa</b></p>
        <p>
            <a href="index.html">Beranda</a>
            <a href="layanan.html">Ajukan Layanan</a>
            <a href="riwayat.html">Riwayat</a>
        </p>
        <p>&copy; 2026 SILA - Dibuat untuk tugas pemrograman web</em></p>
      </footer>
      <!--akhir footer -->
      
    


    
</body>
</html>
